name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=${tag} package=${pkg}"
          if [ "${tag%%-*}" != "${pkg}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Quick sanity check
        run: |
          node --check server.js
          node -e "JSON.parse(require('node:fs').readFileSync('data/indices.json','utf8'))"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes --title "${GITHUB_REF_NAME}")
          case "${GITHUB_REF_NAME}" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "${args[@]}"

          # 把带注释 tag 的正文合并到自动 changelog 前面
          # 用 API 读取 tag 对象，避免 checkout 后本地没有 tag 的情况
          obj_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" -q .object.type)"
          if [ "${obj_type}" = "tag" ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" -q .object.sha)"
            tag_msg="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" -q .message)"
            tag_body="${tag_msg#*$'\n'}"
            if [ -n "${tag_body}" ] && [ "${tag_body}" != "${tag_msg}" ]; then
              current="$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)"
              gh release edit "${GITHUB_REF_NAME}" --notes "${tag_body}"$'\n\n'"${current}"
            fi
          fi
